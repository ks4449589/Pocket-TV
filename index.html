<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pocket TV - JioTV Edition</title>
  
  <!-- HLS Player Engine -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0c101b;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* JioTV Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #111726;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 16px;
    }

    .header-box {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      background: #e11d48;
      color: #fff;
      font-weight: 900;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.2px;
    }

    .search-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 18px;
      cursor: pointer;
    }

    .search-container {
      max-width: 720px;
      margin: 10px auto 0 auto;
    }

    .search-container input {
      width: 100%;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      color: #ffffff;
      outline: none;
    }

    /* 16:9 Sticky Player */
    .player-area {
      position: sticky;
      top: 53px;
      z-index: 40;
      background: #000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .player-wrap {
      max-width: 720px;
      margin: 0 auto;
      position: relative;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }

    .live-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #dc2626;
      color: #ffffff;
      font-size: 9px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 12px;
      letter-spacing: 0.5px;
      pointer-events: none;
      z-index: 10;
    }

    .channel-title-tag {
      position: absolute;
      bottom: 8px;
      left: 12px;
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
      pointer-events: none;
      z-index: 10;
    }

    .player-loader {
      position: absolute;
      inset: 0;
      background: rgba(12, 16, 27, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      z-index: 20;
    }

    .loader-ring {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(225, 29, 72, 0.2);
      border-top-color: #e11d48;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 14px 12px 40px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* JioTV Style Horizontal Pill Tabs */
    .tabs-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tabs-scroll::-webkit-scrollbar {
      display: none;
    }

    .tab-pill {
      background: #162035;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 6px 14px;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease;
    }

    .tab-pill.active {
      background: #e11d48;
      color: #ffffff;
      border-color: #e11d48;
    }

    .tab-counter {
      background: rgba(0,0,0,0.3);
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 10px;
    }

    .section-info {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }

    .section-name {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
    }

    .section-badge {
      font-size: 11px;
      font-weight: 600;
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 2px 8px;
      border-radius: 6px;
    }

    /* 3-Column Channel Grid */
    .channel-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .jio-card {
      background: #162035;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 10px 6px;
      height: 108px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.1s ease, border-color 0.15s ease;
      user-select: none;
    }

    .jio-card:active {
      transform: scale(0.97);
    }

    .jio-card.active {
      background: #1c2742;
      border: 2px solid #e11d48;
      box-shadow: 0 0 15px rgba(225, 29, 72, 0.3);
    }

    .logo-badge {
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 900;
      text-align: center;
      letter-spacing: 0.5px;
      width: 90%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    .channel-label {
      font-size: 11px;
      font-weight: 600;
      color: #e2e8f0;
      text-align: center;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .jio-card.active .channel-label {
      color: #f43f5e;
      font-weight: 700;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Top App Bar -->
  <header>
    <div class="header-box">
      <div class="brand">
        <span class="brand-logo">JIO LIVE</span>
        <span class="brand-title">Pocket TV</span>
      </div>
      <button id="searchBtn" class="search-btn">🔍</button>
    </div>
    <div id="searchWrap" class="search-container hidden">
      <input type="text" id="searchInput" placeholder="चैनल का नाम खोजें (Search live channel)...">
    </div>
  </header>

  <!-- Sticky Player Section -->
  <section class="player-area">
    <div class="player-wrap">
      <video id="tvPlayer" controls autoplay playsinline></video>
      <div class="live-tag">● LIVE</div>
      <div class="channel-title-tag" id="currentChTitle">Channel Loading...</div>
      
      <div class="player-loader" id="loader">
        <div class="loader-ring"></div>
        <p style="font-size:12px; color:#38bdf8;" id="loaderMsg">लोड हो रहा है (Connecting...)</p>
      </div>
    </div>
  </section>

  <!-- Main View -->

      <span class="section-badge" id="countBadge">0 Channels</span>

    <div class="channel-grid" id="grid"></div>
  </main>

      // === DEVOTIONAL ===
      {

        name: "Aastha TV",
        category: "Devotional",

        bg: "linear-gradient(135deg, #78350f, #d97706)",
        color: "#ffffff",
        stream: "https://aasthaott.akamaized.net/110923/smil:aasthatv.smil/index.m3u8"
      },
      {
        id: "anand-tv",
        name: "Anand TV",
        category: "Devotional",
        badge: "ANAND",
        bg: "linear-gradient(135deg, #064e3b, #059669)",
        color: "#ffffff",
        stream: "https://live.legitpro.co.in/anandtv/index.m3u8"
      }
    ];

    let currentCategory = "All";
    let activeChannel = CHANNELS[0];
    let hlsInstance = null;
    let searchQuery = "";

    const videoEl = document.getElementById("tvPlayer");
    const loader = document.getElementById("loader");
    const loaderMsg = document.getElementById("loaderMsg");
    const currentChTitle = document.getElementById("currentChTitle");
    const tabsNav = document.getElementById("tabsNav");
    const grid = document.getElementById("grid");
    const tabTitle = document.getElementById("tabTitle");
    const countBadge = document.getElementById("countBadge");

    function renderTabs() {
      const categories = ["All", "Sports", "Entertainment", "Movies", "News", "Music", "Devotional"];
      tabsNav.innerHTML = "";

      categories.forEach(cat => {
        const count = cat === "All" ? CHANNELS.length : CHANNELS.filter(c => c.category === cat).length;
        if (count === 0 && cat !== "All") return;

        const btn = document.createElement("button");
        btn.className = `tab-pill ${cat === currentCategory ? "active" : ""}`;
        btn.innerHTML = `<span>${cat}</span><span class="tab-counter">${count}</span>`;
        btn.onclick = () => {
          currentCategory = cat;
          renderTabs();
          renderGrid();
        };
        tabsNav.appendChild(btn);
      });
    }

    function renderGrid() {
      grid.innerHTML = "";
      const filtered = CHANNELS.filter(c => {
        const matchCat = currentCategory === "All" || c.category === currentCategory;
        const matchQuery = !searchQuery || c.name.toLowerCase().includes(searchQuery.toLowerCase());
        return matchCat && matchQuery;
      });

      tabTitle.innerText = currentCategory;
      countBadge.innerText = `${filtered.length} Channels`;

      filtered.forEach(ch => {
        const isSelected = activeChannel && activeChannel.id === ch.id;
        const card = document.createElement("div");
        card.className = `jio-card ${isSelected ? "active" : ""}`;

        card.innerHTML = `
          <div style="flex:1;display:flex;align-items:center;justify-content:center;width:100%;">
            <div class="logo-badge" style="background:${ch.bg}; color:${ch.color};">
              ${ch.badge}
            </div>
          </div>
          <div class="channel-label">${ch.name}</div>
        `;

        card.onclick = () => playChannel(ch);
        grid.appendChild(card);
      });
    }

    function playChannel(ch) {
      activeChannel = ch;
      currentChTitle.innerText = ch.name;
      loader.classList.remove("hidden");
      loaderMsg.innerText = "लोड हो रहा है (Connecting...)";

      renderGrid();

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      videoEl.pause();

      if (Hls.isSupported()) {
        hlsInstance = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 30,
          manifestLoadingTimeOut: 8000
        });

        hlsInstance.loadSource(ch.stream);
        hlsInstance.attachMedia(videoEl);

        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          loader.classList.add("hidden");
          videoEl.play().catch(() => {});
        });

        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            loader.classList.remove("hidden");
            loaderMsg.innerText = "चैनल ऑफलाइन है (Offline)";
          }
        });
      } else if (videoEl.canPlayType("application/vnd.apple.mpegurl")) {
        videoEl.src = ch.stream;
        videoEl.play().then(() => {
          loader.classList.add("hidden");
        }).catch(() => {
          loader.classList.add("hidden");
        });
      }
    }

    // Search Toggle
    document.getElementById("searchBtn").onclick = () => {
      const wrap = document.getElementById("searchWrap");
      wrap.classList.toggle("hidden");
      if (!wrap.classList.contains("hidden")) {
        document.getElementById("searchInput").focus();
      }
    };

    document.getElementById("searchInput").oninput = (e) => {
      searchQuery = e.target.value;
      renderGrid();
    };

    window.onload = () => {
      renderTabs();
      renderGrid();
      if (CHANNELS.length > 0) {
        playChannel(CHANNELS[0]);
      }
    };
