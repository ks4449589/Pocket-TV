<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pocket TV - Live Stream</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            app: {
              bg: '#0b111e',
              card: '#162035',
              cardHover: '#1c2842',
              accent: '#2563eb',
              cyanBorder: '#38bdf8'
            }
          }
        }
      }
    }
  </script>

  <!-- HLS.js Library -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', 'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0b111e;
      color: #e2e8f0;
      -webkit-tap-highlight-color: transparent;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-[#0b111e] text-slate-100 selection:bg-blue-600 selection:text-white">

  <!-- Mobile Sticky Top App Bar -->
  <header class="sticky top-0 z-40 bg-[#0b111e]/95 backdrop-blur-md border-b border-white/5 px-4 py-3">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <span class="text-xl">📺</span>
        <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
          Pocket TV
        </h1>
      </div>

      <div class="flex items-center gap-2">
        <button id="searchToggleBtn" class="p-2 rounded-xl bg-app-card hover:bg-white/10 text-slate-300 transition" title="Search">
          <i data-lucide="search" class="w-4 h-4"></i>
        </button>
        <button id="addStreamModalBtn" class="flex items-center gap-1.5 text-xs font-semibold bg-app-card hover:bg-white/10 border border-white/10 px-3 py-2 rounded-xl text-blue-400 transition">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i>
          <span>Add M3U8</span>
        </button>
      </div>
    </div>

    <!-- Search Bar -->
    <div id="searchBarContainer" class="max-w-2xl mx-auto mt-2.5 hidden">
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input 
          type="text" 
          id="channelSearchInput" 
          placeholder="चैनल का नाम खोजें (Search channel...)" 
          class="w-full bg-[#162035] border border-white/10 rounded-xl pl-10 pr-9 py-2 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-blue-500"
        >
        <button id="clearSearchBtn" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white hidden">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Sticky Video Player -->
  <section id="playerWrapper" class="sticky top-[57px] z-30 bg-[#0b111e] border-b border-white/10 shadow-2xl">
    <div class="max-w-2xl mx-auto">
      <div class="relative aspect-video w-full bg-black overflow-hidden group">
        <video id="liveVideoPlayer" class="w-full h-full object-contain cursor-pointer" playsinline autoplay controls></video>

        <!-- Buffering Loader -->
        <div id="playerBuffering" class="absolute inset-0 bg-black/70 flex flex-col items-center justify-center gap-2 z-20 pointer-events-none">
          <div class="w-9 h-9 border-3 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
          <p class="text-[11px] font-medium text-blue-400 tracking-wide">लोड हो रहा है (Connecting stream...)</p>
        </div>

        <!-- Stream Error State -->
        <div id="playerErrorOverlay" class="absolute inset-0 bg-[#0b111e]/95 hidden flex-col items-center justify-center gap-2.5 p-6 text-center z-20">
          <i data-lucide="tv-2" class="w-10 h-10 text-amber-500"></i>
          <p class="text-xs font-semibold text-white">यह चैनल अस्थायी रूप से ऑफलाइन है</p>
          <p class="text-[11px] text-slate-400 max-w-xs">ब्रॉडकास्टर टोकन समाप्त हो सकता है। कृपया दूसरा चैनल चुनें।</p>
          <button id="retryBtn" class="mt-1 px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-xs font-medium rounded-lg flex items-center gap-1.5 transition">
            <i data-lucide="rotate-ccw" class="w-3 h-3"></i> पुनः प्रयास (Retry)
          </button>
        </div>

        <!-- Top Live Badge & Overlay Info -->
        <div class="absolute top-2 left-2 right-2 flex items-center justify-between pointer-events-none z-10 transition-opacity duration-300">
          <div class="flex items-center gap-2">
            <span class="inline-flex items-center gap-1.5 bg-red-600/90 text-white font-bold text-[9px] uppercase px-2 py-0.5 rounded-full shadow-md">
              <span class="w-1.5 h-1.5 rounded-full bg-white animate-ping"></span>
              LIVE
            </span>
            <span id="playerChannelCategory" class="text-[10px] bg-black/60 backdrop-blur-md text-slate-200 px-2 py-0.5 rounded-md border border-white/10">
              Entertainment
            </span>
          </div>

          <div class="flex items-center gap-1.5 pointer-events-auto">
            <button id="playerFullscreenBtn" class="p-1.5 rounded-full bg-black/50 hover:bg-black/80 text-white transition">
              <i data-lucide="maximize" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- Bottom Current Playing Bar -->
        <div class="absolute bottom-10 inset-x-0 px-3 py-1 bg-gradient-to-t from-black/80 via-black/30 to-transparent flex items-center justify-between pointer-events-none z-10">
          <div class="flex items-center gap-2 truncate">
            <span id="playerChannelName" class="text-xs font-bold text-white tracking-wide truncate">
              Zee Anmol

          </div>
          <span class="text-[10px] text-emerald-400 font-mono flex items-center gap-1">

        </div>
      </div>
    </div>
  </section>

  <!-- Main Content Area -->
  <main class="flex-1 max-w-2xl w-full mx-auto px-3.5 py-4 flex flex-col gap-4">

    <!-- Horizontal Category Pills -->
    <div class="overflow-x-auto no-scrollbar -mx-3.5 px-3.5">
      <div id="categoryPillList" class="flex items-center gap-2 min-w-max pb-1"></div>
    </div>

    <!-- Active Section Header -->
    <div class="flex items-center gap-2.5 pt-1">
      <h2 id="activeSectionTitle" class="text-xl font-bold text-white tracking-tight">
        All
      </h2>
      <span id="sectionCountBadge" class="text-xs font-semibold px-2.5 py-0.5 rounded-md bg-[#162035] text-blue-400 border border-blue-500/20">
        0 Channels
      </span>
    </div>

    <!-- 3-Column Channel Grid -->
    <div id="channelGrid" class="grid grid-cols-3 gap-2.5 sm:gap-3.5 pb-12"></div>

    <div id="noChannelFound" class="hidden flex-col items-center justify-center p-12 text-center">
      <i data-lucide="search-x" class="w-10 h-10 text-slate-500 mb-2"></i>
      <p class="text-xs text-slate-400">कोई चैनल नहीं मिला</p>
    </div>
  </main>

  <!-- Add Stream Modal -->
  <div id="addStreamModal" class="fixed inset-0 z-50 bg-black/80 hidden items-center justify-center p-4">
    <div class="bg-[#162035] border border-white/10 rounded-2xl max-w-sm w-full p-5 shadow-2xl relative">
      <button id="closeStreamModalBtn" class="absolute top-4 right-4 text-slate-400 hover:text-white p-1">

      </button>

        <span class="text-lg">📺</span>
        <h3 class="text-sm font-bold text-white">कस्टम M3U8 चैनल जोड़ें</h3>
      </div>

      <form id="newChannelForm" class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-300 font-medium mb-1">चैनल का नाम *</label>
          <input type="text" id="inputName" required placeholder="जैसे: My Live TV" class="w-full bg-[#0b111e] border border-white/10 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-slate-300 font-medium mb-1">M3U8 लिंक *</label>
          <input type="url" id="inputUrl" required placeholder="https://.../index.m3u8" class="w-full bg-[#0b111e] border border-white/10 rounded-xl px-3 py-2 font-mono text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-slate-300 font-medium mb-1">श्रेणी (Category)</label>
          <select id="inputCategory" class="w-full bg-[#0b111e] border border-white/10 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-blue-500">
            <option value="Entertainment">Entertainment</option>
            <option value="Movies">Movies</option>
            <option value="Music">Music</option>
            <option value="News">News</option>
            <option value="Devotional">Devotional</option>
          </select>
        </div>

        <div class="pt-2 flex gap-2">
          <button type="button" id="cancelStreamBtn" class="flex-1 py-2 rounded-xl border border-white/10 text-slate-300 hover:bg-white/5 font-medium">रद्द करें</button>
          <button type="submit" class="flex-1 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold">सेव करें</button>
        </div>
      </form>
    </div>
  </div>

    function getCategoryCounts() {
      const counts = { 'All': channels.length };
      channels.forEach(ch => {
        counts[ch.category] = (counts[ch.category] || 0) + 1;
      });
      return counts;
    }

    function renderCategoryPills() {
      categoryPillList.innerHTML = '';
      const counts = getCategoryCounts();
      const categoriesOrder = ['All', 'Entertainment', 'Movies', 'Music', 'News', 'Devotional'];

      categoriesOrder.forEach(cat => {
        if (!counts[cat]) return;
        const isSelected = selectedCategory === cat;
        const count = counts[cat];

        const pill = document.createElement('button');
        pill.className = `flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl text-xs font-semibold transition active:scale-95 shrink-0 ${
          isSelected 
            ? 'bg-[#2563eb] text-white shadow-md shadow-blue-600/30 font-bold' 
            : 'bg-[#151e30] text-slate-300 hover:text-white hover:bg-[#1a263d]'
        }`;

        pill.innerHTML = `
          <span>${cat}</span>
          <span class="text-[11px] px-1.5 py-0.2 rounded-full ${isSelected ? 'bg-blue-800 text-white font-bold' : 'bg-black/30 text-slate-400'}">
            ${count}
          </span>
        `;

        pill.addEventListener('click', () => {
          selectedCategory = cat;
          renderCategoryPills();
          renderGrid();
        });

        categoryPillList.appendChild(pill);
      });
    }

    function renderGrid() {
      channelGrid.innerHTML = '';

      const filtered = channels.filter(ch => {
        const matchesCategory = selectedCategory === 'All' || ch.category === selectedCategory;
        const q = searchQuery.toLowerCase().trim();
        const matchesSearch = !q || ch.name.toLowerCase().includes(q) || ch.category.toLowerCase().includes(q);
        return matchesCategory && matchesSearch;
      });

      activeSectionTitle.textContent = selectedCategory;
      sectionCountBadge.textContent = `${filtered.length} Channels`;

      if (filtered.length === 0) {
        noChannelFound.classList.remove('hidden');
        noChannelFound.classList.add('flex');
        return;
      } else {
        noChannelFound.classList.add('hidden');
        noChannelFound.classList.remove('flex');
      }

      filtered.forEach(ch => {
        const isSelected = selectedChannel && selectedChannel.id === ch.id;

        const card = document.createElement('div');
        card.className = `cursor-pointer flex flex-col items-center justify-between p-3 h-28 sm:h-32 rounded-2xl transition duration-150 select-none ${
          isSelected 
            ? 'bg-[#122347] border-2 border-[#38bdf8] shadow-lg shadow-sky-500/20' 
            : 'bg-[#162035] border border-white/5 hover:border-white/20 hover:bg-[#1c2842]'
        }`;

        card.innerHTML = `
          <div class="flex-1 flex items-center justify-center w-full">
            <div class="px-2.5 py-1.5 rounded-lg text-center font-extrabold text-xs tracking-wider shadow-md" style="background: ${ch.badgeBg || '#1e293b'}; color: ${ch.logoColor || '#ffffff'}">
              ${ch.logoText || ch.name.substring(0, 6)}
            </div>
          </div>
          <div class="w-full text-center mt-1">
            <span class="text-[11px] sm:text-xs font-semibold ${isSelected ? 'text-[#38bdf8] font-bold' : 'text-slate-200'} truncate block">
              ${ch.name}
            </span>
          </div>
        `;

        card.addEventListener('click', () => {
          switchChannel(ch);
        });

        channelGrid.appendChild(card);
      });
    }

    function switchChannel(channel) {
      if (!channel) return;
      selectedChannel = channel;
      
      playerChannelName.textContent = channel.name;
      playerChannelCategory.textContent = channel.category;

      renderGrid();
      playStream(channel.streamUrl);
      showToast(`${channel.name} चालू है`);
    }

    function playStream(url) {
      playerErrorOverlay.classList.add('hidden');
      playerErrorOverlay.classList.remove('flex');
      playerBuffering.classList.remove('hidden');
      playerBuffering.classList.add('flex');

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      if (Hls.isSupported()) {
        hlsInstance = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 30,
          manifestLoadingTimeOut: 10000
        });

        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(video);

        hlsInstance.on(Hls.Events.MANIFEST_PARSED, function () {
          playerBuffering.classList.add('hidden');
          playerBuffering.classList.remove('flex');
          video.play().catch(() => {});
        });

        hlsInstance.on(Hls.Events.ERROR, function (event, data) {
          if (data.fatal) {
            playerBuffering.classList.add('hidden');
            playerBuffering.classList.remove('flex');
            playerErrorOverlay.classList.remove('hidden');
            playerErrorOverlay.classList.add('flex');
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', function () {
          playerBuffering.classList.add('hidden');
          playerBuffering.classList.remove('flex');
          video.play().catch(() => {});
        });

        video.addEventListener('error', function () {
          playerBuffering.classList.add('hidden');
          playerBuffering.classList.remove('flex');
          playerErrorOverlay.classList.remove('hidden');
          playerErrorOverlay.classList.add('flex');
        });
      }
    }

    function showToast(text) {
      toastText.textContent = text;
      toastNotification.classList.remove('opacity-0', 'translate-y-20');
      toastNotification.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toastNotification.classList.remove('opacity-100', 'translate-y-0');
        toastNotification.classList.add('opacity-0', 'translate-y-20');
      }, 2000);
    }

    function setupEvents() {
      retryBtn.addEventListener('click', () => {
        if (selectedChannel) playStream(selectedChannel.streamUrl);
      });

      playerFullscreenBtn.addEventListener('click', () => {
        const wrapper = document.getElementById('playerWrapper');
        if (!document.fullscreenElement) {
          if (wrapper.requestFullscreen) wrapper.requestFullscreen();
          else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
        } else {
          if (document.exitFullscreen) document.exitFullscreen();
        }
      });

      searchToggleBtn.addEventListener('click', () => {
        const isHidden = searchBarContainer.classList.contains('hidden');
        searchBarContainer.classList.toggle('hidden', !isHidden);
        if (isHidden) channelSearchInput.focus();
      });

      channelSearchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        clearSearchBtn.classList.toggle('hidden', searchQuery.length === 0);
        renderGrid();
      });

      clearSearchBtn.addEventListener('click', () => {
        channelSearchInput.value = '';
        searchQuery = '';
        clearSearchBtn.classList.add('hidden');
        renderGrid();
      });

      addStreamModalBtn.addEventListener('click', () => {
        addStreamModal.classList.remove('hidden');
        addStreamModal.classList.add('flex');
      });

      const hideAddModal = () => {
        addStreamModal.classList.add('hidden');
        addStreamModal.classList.remove('flex');
      };

      closeStreamModalBtn.addEventListener('click', hideAddModal);
      cancelStreamBtn.addEventListener('click', hideAddModal);

      newChannelForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('inputName').value.trim();
        const url = document.getElementById('inputUrl').value.trim();
        const cat = document.getElementById('inputCategory').value;

        if (!name || !url) return;

        const newChannel = {
          id: 'custom-' + Date.now(),
          name: name,
          category: cat,
          logoText: name.slice(0, 4).toUpperCase(),
          logoColor: '#38bdf8',
          badgeBg: 'linear-gradient(135deg, #1e293b, #334155)',
          streamUrl: url
        };

        channels.unshift(newChannel);
        hideAddModal();
        newChannelForm.reset();
        renderCategoryPills();
        renderGrid();
        switchChannel(newChannel);
        showToast('नया चैनल सफलतापूर्वक जोड़ा गया!');
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderCategoryPills();
      renderGrid();
      setupEvents();
      lucide.createIcons();

      if (channels.length > 0) {
        switchChannel(channels[0]);
      }
    });
  </script>
</body>
</html>
